name = "k4iyo-private-statements"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Route only the five statement directories. The public homepage is unchanged.
routes = [
  { pattern = "k4iyo.com/s1*", zone_name = "k4iyo.com" },
  { pattern = "k4iyo.com/s2*", zone_name = "k4iyo.com" },
  { pattern = "k4iyo.com/s3*", zone_name = "k4iyo.com" },
  { pattern = "k4iyo.com/s4*", zone_name = "k4iyo.com" },
  { pattern = "k4iyo.com/s5*", zone_name = "k4iyo.com" }
]

[[kv_namespaces]]
binding = "STATEMENTS"
id = "8d76b06ec65e4e879e183d2e423ebef7"

[[kv_namespaces]]
binding = "LOGIN_LOG"
id = "06a93092156b4498a88894e71c8dd4af"

[[durable_objects.bindings]]
name = "GATE_LIMITER"
class_name = "GateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GateLimiter"]

# Configure these as Worker secrets, not plaintext variables:
# GATE_SALT_B64, GATE_HASH_B64, SESSION_SIGNING_KEY_B64, CONTENT_KEY_B64
